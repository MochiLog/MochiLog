name: iOS Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'ビルド番号（空欄の場合は自動採番）'
        required: false
        type: string
      upload_to_testflight:
        description: 'TestFlightにアップロードするか'
        required: false
        default: false
        type: boolean

jobs:
  # ============================================
  # 署名付きIPA（App Store提出用）
  # ============================================
  build-signed:
    name: Build Signed IPA
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 27
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" = 27

      - name: Check bundled third-party licenses
        run: python3 scripts/check-third-party-licenses.py

      - name: Install fastlane
        run: |
          gem install fastlane

      - name: Build IPA
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          export BUILD_NUMBER="${BUILD_NUMBER:-$((1000 + GITHUB_RUN_NUMBER))}"
          fastlane build_appstore

      - name: Upload to TestFlight
        if: github.event_name == 'push' || github.event.inputs.upload_to_testflight == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          fastlane upload_testflight

      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochiLog-Signed
          path: build/MochiLog.ipa

  # ============================================
  # 署名なしIPA（開発・配布用）
  # ============================================
  build-unsigned:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.upload_to_testflight != 'true'
    name: Build Unsigned IPA
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 27
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" = 27

      - name: Check bundled third-party licenses
        run: python3 scripts/check-third-party-licenses.py

      - name: Build App (Archive without signing)
        run: |
          xcodebuild archive \
            -project MochiLog.xcodeproj \
            -scheme MochiLog \
            -configuration Release \
            -archivePath build/MochiLog.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -destination "generic/platform=iOS"

      - name: Create Unsigned IPA
        run: |
          # .appをPayloadフォルダに入れてZIP化し、.ipaに改名
          mkdir -p build/Payload
          cp -r build/MochiLog.xcarchive/Products/Applications/MochiLog.app build/Payload/
          cd build
          zip -r MochiLog-Unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochiLog-Unsigned
          path: build/MochiLog-Unsigned.ipa
