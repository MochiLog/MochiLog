name: Automatic collection UI verification
on:
  workflow_dispatch:
    inputs:
      verification:
        description: Checks to run
        type: choice
        default: all
        options: [all, installer, ui]
permissions:
  contents: read
jobs:
  pair-installer:
    if: inputs.verification != 'ui'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify upstream direct-install integration
        shell: bash
        run: |
          git clone https://github.com/jkcoxson/idevice_pair.git idevice-pair
          cd idevice-pair
          git checkout c8114c2bb88a80e2e17c0d9297b9915f09498ead
          git apply "$GITHUB_WORKSPACE/scripts/patches/idevice-pair-mochilog.patch"
          cargo fmt --check
          cargo test --locked -j 2
          cargo build --locked -j 2
      - uses: actions/upload-artifact@v4
        with:
          name: idevice-pair-mochilog-${{ matrix.os }}
          path: |
            idevice-pair/target/debug/idevice_pair
            idevice-pair/target/debug/idevice_pair.exe
          retention-days: 2
  ui:
    if: inputs.verification != 'installer'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify on-device pairing boundary and localization
        run: |
          bash scripts/test-local-pairing.sh
          python3 scripts/audit-localizations.py
      - name: Build local diagnostics dependency
        env:
          CARGO_BUILD_JOBS: '3'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y; fi
          rustup update stable
          bash scripts/build-local-diagnostics.sh
      - uses: actions/upload-artifact@v4
        with:
          name: local-diagnostics-xcframework
          path: Build/LocalDiagnostics/idevice.xcframework
          retention-days: 2
      - name: Verify eight languages and tab changes on iPad and iPhone
        run: bash scripts/test-automatic-collection-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-collection-ui-results
          path: |
            Build/automatic-ui-*.xcresult
            Build/automatic-ui-*-native.json
