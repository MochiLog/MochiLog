name: Manage App Store release
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: inspect
        options: [inspect, withdraw, prepare, verify, submit]
        description: 'Submit only with explicit authorization, after external TestFlight distribution'
      marketing_version:
        type: string
        default: '4.0.0'
      build_number:
        type: string
        default: '1061'
permissions:
  contents: read
jobs:
  appstore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install jwt --no-document
      - name: Verify submission safeguards
        run: ruby scripts/test-appstore-review-submission.rb
      - name: Manage the selected version using the explicitly requested mode
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          RELEASE_MODE: ${{ inputs.mode }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: ruby scripts/appstore-release.rb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-release-inventory
          path: build/appstore-release/
          retention-days: 7
